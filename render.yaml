services:
  - type: web
    name: judicial-triage-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python backend/run.py
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./triage_court.db
      - key: CORS_ORIGINS
        value: "*"
      - key: ENVIRONMENT
        value: production
